
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAP UI5 i18n Key Extractor</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: '72', Arial, Helvetica, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f6f7;
        }
        h1 {
            color: #32363a;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #6a6d70;
            margin-bottom: 30px;
        }
        .container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .panel {
            flex: 1;
            min-width: 400px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
            color: #32363a;
        }
        textarea {
            width: 100%;
            height: 400px;
            padding: 12px;
            border: 1px solid #899199;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            resize: vertical;
        }
        textarea:focus {
            outline: 2px solid #0a6ed1;
            border-color: transparent;
        }
        .button-container {
            display: flex;
            gap: 10px;
            margin: 20px 0;
        }
        button {
            padding: 10px 24px;
            background-color: #0a6ed1;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }
        button:hover {
            background-color: #0854a0;
        }
        button.secondary {
            background-color: white;
            color: #0a6ed1;
            border: 1px solid #0a6ed1;
        }
        button.secondary:hover {
            background-color: #f0f4f8;
        }
        .stats {
            margin-top: 15px;
            padding: 10px;
            background-color: #eaecee;
            border-radius: 4px;
            color: #32363a;
            font-size: 14px;
        }
        .copy-success {
            color: #107e3e;
            font-weight: bold;
            margin-left: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <h1>SAP UI5 i18n Key Extractor</h1>
    <p class="subtitle">Extract all i18n keys from your XML view snippets</p>

    <div class="container">
        <div class="panel">
            <label for="xmlInput">Paste your XML here:</label>
            <textarea id="xmlInput" placeholder="<Title text=&quot;{i18n>my.key}&quot;/>"></textarea>
            <div class="button-container">
                <button onclick="extractKeys()">Extract Keys</button>
                <button class="secondary" onclick="clearAll()">Clear</button>
            </div>
        </div>

        <div class="panel">
            <label for="output">
                Extracted Keys:
                <span id="copySuccess" class="copy-success">✓ Copied!</span>
            </label>
            <textarea id="output" readonly placeholder="Keys will appear here..."></textarea>
            <div class="button-container">
                <button onclick="copyToClipboard()">Copy to Clipboard</button>
            </div>
            <div class="stats" id="stats">No keys extracted yet</div>
        </div>
    </div>

    <script>
        function extractKeys() {
            const xml = document.getElementById('xmlInput').value;
            const output = document.getElementById('output');
            const stats = document.getElementById('stats');

            // Regex to match i18n> followed by any characters until the next quote
            const regex = /i18n>([^"'}\s]+)/g;
            const matches = [...xml.matchAll(regex)];

            // Extract unique keys
            const keys = [...new Set(matches.map(m => m[1]))];

            // Display results
            output.value = keys.join('\n');

            // Update stats
            if (keys.length > 0) {
                stats.textContent = `Found ${keys.length} unique i18n key(s)`;
            } else {
                stats.textContent = 'No i18n keys found';
            }
        }

        function copyToClipboard() {
            const output = document.getElementById('output');
            output.select();
            output.setSelectionRange(0, 99999);
            document.execCommand('copy');

            // Show success message
            const successMsg = document.getElementById('copySuccess');
            successMsg.style.display = 'inline';
            setTimeout(() => {
                successMsg.style.display = 'none';
            }, 2000);
        }

        function clearAll() {
            document.getElementById('xmlInput').value = '';
            document.getElementById('output').value = '';
            document.getElementById('stats').textContent = 'No keys extracted yet';
        }

        // Auto-extract on paste
        document.getElementById('xmlInput').addEventListener('paste', function() {
            setTimeout(extractKeys, 100);
        });
    </script>
</body>
</html>
